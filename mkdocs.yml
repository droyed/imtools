site_name: imtools
site_description: Image processing and visualization toolkit
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_submodules: false
            members_order: source

nav:
  - Home: index.md
  - Usage: USAGE_overlay_visualize.md
  - API Reference:
      - Core: api/core.md
      - Masks: api/masks.md
      - Annotations: api/annotations.md
      - Visualization: api/viz.md
      - Benchmarks: api/benchmarks.md
